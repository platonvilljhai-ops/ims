<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Stock - EduShelf</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 text-slate-900">

  <div class="min-h-screen flex flex-col lg:flex-row w-full">
    <!-- Sidebar -->
    <aside class="w-full lg:w-64 bg-white border-b lg:border-b-0 lg:border-r border-slate-200 flex-shrink-0 flex flex-col justify-between">
      <div>
        <div class="h-16 px-6 flex items-center justify-between border-b border-slate-200">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-[#14AE5C] flex items-center justify-center text-white font-bold">
              <i data-lucide="boxes" class="w-4 h-4"></i>
            </div>
            <span class="font-semibold text-slate-900">EduShelf</span>
          </div>
        </div>

        <nav class="p-4 space-y-1">
          <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">
            <i data-lucide="layout-dashboard" class="w-4 h-4 text-slate-400"></i> Dashboard
          </a>
          <a href="inventory.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-[#14AE5C]/10 text-[#14AE5C]">
            <i data-lucide="package" class="w-4 h-4 text-[#14AE5C]"></i> Inventory Stock
          </a>
          <a href="#" onclick="alert('Supply Requests module coming soon!')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">
            <i data-lucide="arrow-left-right" class="w-4 h-4 text-slate-400"></i> Supply Requests
          </a>
          <a href="#" onclick="alert('Activity Audit Log module coming soon!')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">
            <i data-lucide="file-clock" class="w-4 h-4 text-slate-400"></i> Activity Audit Log
          </a>
        </nav>
      </div>

      <div class="p-4 border-t border-slate-200 flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-slate-200 overflow-hidden flex-shrink-0">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Avatar" class="w-full h-full object-cover">
        </div>
        <div class="min-w-0">
          <p id="sidebarProfileName" class="text-xs font-semibold text-slate-900 truncate">Juan Dela Cruz</p>
          <p id="sidebarProfileRole" class="text-[11px] text-slate-500 truncate">Administrator</p>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
      <header class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-slate-200 px-8 py-4">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 w-full">
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Inventory Stock</h1>
            <p class="text-xs text-slate-500">Master database catalog of warehouse items</p>
          </div>
          <div class="flex items-center gap-3">
            <div class="relative">
              <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
              <input type="text" id="searchInput" onkeyup="filterInventory()" placeholder="Search code, name, category..." 
                class="pl-9 pr-4 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:border-[#14AE5C] w-72 bg-white" />
            </div>
            <a href="add-item.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-[#14AE5C] hover:bg-[#11964f] text-sm font-semibold text-white transition">
              <i data-lucide="plus" class="w-4 h-4"></i> Add Item
            </a>
          </div>
        </div>
      </header>

      <main class="flex-1 p-8">
        <div class="w-full">
          <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-xs">
            <div class="overflow-x-auto w-full">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-200 bg-slate-50 text-[11px] font-semibold uppercase text-slate-500">
                    <th class="py-3 px-6">Product Code</th>
                    <th class="py-3 px-4">Product Name</th>
                    <th class="py-3 px-4">Category</th>
                    <th class="py-3 px-4">Quantity</th>
                    <th class="py-3 px-4">Unit Price</th>
                    <th class="py-3 px-4">Location</th>
                    <th class="py-3 px-6">Status</th>
                  </tr>
                </thead>
                <tbody id="inventoryTableBody" class="divide-y divide-slate-100 text-sm">
                  <!-- Populated by JavaScript -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

<script src="app.js"></script>
  <script>
    var combinedList = getFullInventory();

    function displayTable(itemsArray) {
      var tbody = document.getElementById("inventoryTableBody");
      tbody.innerHTML = "";

      for (var i = 0; i < itemsArray.length; i++) {
        var item = itemsArray[i];
        var badgeClass = getStatusBadgeClass(item.status);
        var detailsUrl = "details.html?code=" + encodeURIComponent(item.product_code);
        tbody.innerHTML += `
          <tr onclick="window.location.href='${detailsUrl}'" class="hover:bg-slate-50 transition cursor-pointer">
            <td class="py-3.5 px-6 font-mono font-medium text-slate-900">${item.product_code}</td>
            <td class="py-3.5 px-4 font-medium text-slate-900">${item.product_name}</td>
            <td class="py-3.5 px-4 text-slate-600">${item.category}</td>
            <td class="py-3.5 px-4 font-semibold tabular-nums">${item.quantity}</td>
            <td class="py-3.5 px-4 text-slate-600 tabular-nums">₱${item.unit_price}</td>
            <td class="py-3.5 px-4 text-slate-600">${item.location}</td>
            <td class="py-3.5 px-4"><span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-semibold ${badgeClass}">${item.status}</span></td>
            <td class="py-3.5 px-6 text-right">
              <a href="${detailsUrl}" onclick="event.stopPropagation()" class="text-xs font-semibold text-[#14AE5C] hover:underline">View →</a>
            </td>
          </tr>
        `;
      }
    }

    function filterInventory() {
      var query = document.getElementById("searchInput").value.toLowerCase();
      var filtered = combinedList.filter(function (item) {
        return item.product_code.toLowerCase().includes(query) ||
               item.product_name.toLowerCase().includes(query) ||
               item.category.toLowerCase().includes(query);
      });
      displayTable(filtered);
    }

    displayTable(combinedList);
  </script>
</body>
</html>
