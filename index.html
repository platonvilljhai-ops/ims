<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - EduShelf</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 text-slate-900 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md p-6">
    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
      <div class="flex flex-col items-center text-center mb-8">
        <div class="w-12 h-12 rounded-xl bg-[#14AE5C] flex items-center justify-center text-white font-bold mb-3">
          <i data-lucide="boxes" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-900">EduShelf</h1>
        <p class="text-xs text-slate-500 mt-1">School Supplies Storage System</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1.5">Email Address</label>
          <input type="email" id="loginEmail" required placeholder="admin@stockflow.ph"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-[#14AE5C]" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1.5">Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-[#14AE5C]" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1.5">Role</label>
          <select id="loginRole" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-[#14AE5C] bg-white">
            <option value="Administrator">Administrator</option>
            <option value="Warehouse Staff">Warehouse Staff</option>
          </select>
        </div>
        <button type="submit" class="w-full mt-2 py-2.5 rounded-lg bg-[#14AE5C] hover:bg-[#11964f] text-sm font-semibold text-white transition">
          Sign In
        </button>
      </form>

      <div class="text-center mt-6 pt-6 border-t border-slate-100 text-xs text-slate-500">
        Don't have an account? <a href="register.html" class="font-semibold text-[#14AE5C] hover:underline">Create account</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    function handleLogin(event) {
      event.preventDefault();
      var role = document.getElementById("loginRole").value;
      var name = (role === "Administrator") ? "Juan Dela Cruz" : "Maria Santos";
      localStorage.setItem("userName", name);
      localStorage.setItem("userRole", role);
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
