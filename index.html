<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - EduShelf</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 text-slate-900 flex items-center justify-center min-h-screen" data-page="login">

  <div class="w-full max-w-md p-6">
    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
      <div class="flex flex-col items-center text-center mb-8">
        <div class="w-12 h-12 rounded-xl bg-[#14AE5C] flex items-center justify-center text-white font-bold mb-3">
          <i data-lucide="boxes" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-900">EduShelf</h1>
        <p class="text-xs text-slate-500 mt-1">School Supplies Storage System</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div id="loginBanner" class="hidden" role="alert">
          <span data-banner-text></span>
        </div>

        <div>
          <label for="loginEmail" class="block text-xs font-medium text-slate-700 mb-1.5">Email Address</label>
          <input type="email" id="loginEmail" required autocomplete="email" placeholder="admin@edushelf.edu.ph"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-[#14AE5C]" />
        </div>
        <div>
          <label for="loginPassword" class="block text-xs font-medium text-slate-700 mb-1.5">Password</label>
          <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-[#14AE5C]" />
        </div>
        <button type="submit" class="w-full mt-2 py-2.5 rounded-lg bg-[#14AE5C] hover:bg-[#11964f] text-sm font-semibold text-white transition">
          Sign In
        </button>
      </form>

      <div class="mt-5 rounded-lg bg-slate-50 border border-slate-200 px-3.5 py-3 text-[11px] text-slate-600 space-y-1">
        <p class="font-semibold text-slate-700">Demo accounts</p>
        <p><span class="font-medium text-slate-700">Administrator:</span> admin@edushelf.edu.ph / Admin@1234</p>
        <p><span class="font-medium text-slate-700">Warehouse Staff:</span> staff@edushelf.edu.ph / Staff@1234</p>
      </div>

      <div class="text-center mt-6 pt-6 border-t border-slate-100 text-xs text-slate-500">
        Don't have an account? <a href="register.html" class="font-semibold text-[#14AE5C] hover:underline">Create account</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
