<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Item - EduShelf</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 text-slate-900">

  <div class="min-h-screen flex flex-col lg:flex-row w-full">
    <!-- Sidebar -->
    <aside class="w-full lg:w-64 bg-white border-b lg:border-b-0 lg:border-r border-slate-200 flex-shrink-0 flex flex-col justify-between">
      <div>
        <div class="h-16 px-6 flex items-center justify-between border-b border-slate-200">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-[#14AE5C] flex items-center justify-center text-white font-bold">
              <i data-lucide="boxes" class="w-4 h-4"></i>
            </div>
            <span class="font-semibold text-slate-900">EduShelf</span>
          </div>
        </div>

        <nav class="p-4 space-y-1">
          <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">
            <i data-lucide="layout-dashboard" class="w-4 h-4 text-slate-400"></i> Dashboard
          </a>
          <a href="inventory.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-[#14AE5C]/10 text-[#14AE5C]">
            <i data-lucide="package" class="w-4 h-4 text-[#14AE5C]"></i> Inventory Stock
          </a>
          <a href="#" onclick="alert('Supply Requests module coming soon!')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">
            <i data-lucide="arrow-left-right" class="w-4 h-4 text-slate-400"></i> Supply Requests
          </a>
          <a href="#" onclick="alert('Activity Audit Log module coming soon!')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">
            <i data-lucide="file-clock" class="w-4 h-4 text-slate-400"></i> Activity Audit Log
          </a>
        </nav>
      </div>

      <div class="p-4 border-t border-slate-200 flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-slate-200 overflow-hidden flex-shrink-0">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Avatar" class="w-full h-full object-cover">
        </div>
        <div class="min-w-0">
          <p id="sidebarProfileName" class="text-xs font-semibold text-slate-900 truncate">Juan Dela Cruz</p>
          <p id="sidebarProfileRole" class="text-[11px] text-slate-500 truncate">Administrator</p>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
      <header class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-slate-200 px-8 py-4">
        <div class="w-full">
          <a href="inventory.html" class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-500 hover:text-slate-800 mb-1">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Inventory
          </a>
          <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Add New Inventory Item</h1>
        </div>
      </header>

      <main class="flex-1 p-8">
        <div class="w-full">
          <div class="bg-white rounded-xl border border-slate-200 p-8 shadow-xs">
            <form id="addItemForm" onsubmit="saveItemToDatabase(event)" class="space-y-6">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1.5">Product Code (SKU)</label>
                  <input type="text" id="inputCode" required placeholder="e.g., OFF-109"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-[#14AE5C]" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1.5">Product Name</label>
                  <input type="text" id="inputName" required placeholder="e.g., Heavy Duty Stapler"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-[#14AE5C]" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1.5">Category</label>
                  <select id="inputCategory" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-[#14AE5C] bg-white">
                    <option value="Stationery">Stationery</option>
                    <option value="Writing Tool">Writing Tool</option>
                    <option value="Printer Supplies">Printer Supplies</option>
                    <option value="Office Equipment">Office Equipment</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1.5">Storage Location</label>
                  <input type="text" id="inputLocation" required placeholder="e.g., Shelf A2"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-[#14AE5C]" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1.5">Initial Quantity</label>
                  <input type="number" id="inputQty" min="0" required value="12"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm tabular-nums focus:outline-none focus:border-[#14AE5C]" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1.5">Unit Price (₱)</label>
                  <input type="number" id="inputPrice" step="0.01" min="0" required placeholder="45.00"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm tabular-nums focus:outline-none focus:border-[#14AE5C]" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1.5">Minimum Stock Threshold (Alert Trigger)</label>
                  <input type="number" id="inputThreshold" min="1" required value="5"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm tabular-nums focus:outline-none focus:border-[#14AE5C]" />
                </div>
              </div>

              <div class="flex items-center justify-end gap-3 pt-6 border-t border-slate-200">
                <a href="inventory.html" class="px-4 py-2 rounded-lg border border-slate-200 text-sm font-medium text-slate-700 hover:bg-slate-50">
                  Cancel
                </a>
                <button type="submit" class="px-5 py-2 rounded-lg bg-[#14AE5C] hover:bg-[#11964f] text-sm font-semibold text-white shadow-sm transition">
                  Save Item Record
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

<script src="app.js"></script>
  <script>
    var randomCode = Math.floor(100 + Math.random() * 900);
    document.getElementById("inputCode").value = "OFF-" + randomCode;

    function saveItemToDatabase(event) {
      event.preventDefault();

      var result = addItem({
        product_code: document.getElementById("inputCode").value,
        product_name: document.getElementById("inputName").value,
        category: document.getElementById("inputCategory").value,
        location: document.getElementById("inputLocation").value,
        quantity: document.getElementById("inputQty").value,
        unit_price: document.getElementById("inputPrice").value,
        threshold: document.getElementById("inputThreshold").value
      });

      if (!result.success) {
        alert(result.message);
        return;
      }

      alert("New item successfully recorded!");
      window.location.href = "details.html?code=" + encodeURIComponent(result.item.product_code);
    }
  </script>
</body>
</html>
